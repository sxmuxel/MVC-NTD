{% extends "base.html" %}

{% block title %}Editar Categoría{% endblock %}

{% block content %}
<h2 class="mb-4">Editar CRUD</h2>

<div class="card">
    <div class="card-body">
        <form method="POST" action="{{ url_for('editar_categoria', id=categoria.id) }}">
            
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre de la Aplicación *</label>
                <input type="text"
                       class="form-control"
                       id="nombre"
                       name="nombre"
                       value="{{ categoria.nombre }}"
                       required
                       maxlength="100">
            </div>

            <div class="mb-3">
                <label for="tipo_enfoque" class="form-label">Tipo de Enfoque *</label>
                <select class="form-select" id="tipo_enfoque" name="tipo_enfoque" required>
                    <option value="">Selecciona un enfoque</option>
                    <option value="Augmentation"
                        {% if categoria.tipo_enfoque == "Augmentation" %}selected{% endif %}>
                        Augmentation
                    </option>
                    <option value="Automation"
                        {% if categoria.tipo_enfoque == "Automation" %}selected{% endif %}>
                        Automation
                    </option>
                    <option value="Hybrid"
                        {% if categoria.tipo_enfoque == "Hybrid" %}selected{% endif %}>
                        Hybrid
                    </option>
                </select>
            </div>

            <div class="mb-3">
                <label for="descripcion" class="form-label">Descripción</label>
                <textarea class="form-control"
                          id="descripcion"
                          name="descripcion"
                          rows="3">{{ categoria.descripcion or '' }}</textarea>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-warning">
                    <i class="bi bi-check-circle"></i> Actualizar
                </button>
                <a href="{{ url_for('listar_categorias') }}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> Volver
                </a>
            </div>

        </form>
    </div>
</div>
{% endblock %}
